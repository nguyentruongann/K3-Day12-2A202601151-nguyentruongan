# Checkpoint 5 — Railway deployment configuration.
# Secrets/environment values are configured in Railway Variables, not committed here.
# Railway injects PORT automatically; the application must listen on $PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
